services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pycon
      POSTGRES_USER: pycon
      POSTGRES_PASSWORD: pycon
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on: [db]
    ports: ["8000:8000"]
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DATABASE_URL: postgres://pycon:pycon@db:5432/pycon
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
